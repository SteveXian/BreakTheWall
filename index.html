<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#5ec8ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Break the Wall!</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='55' r='38' fill='%233b3f5c'/><circle cx='36' cy='50' r='9' fill='white'/><circle cx='64' cy='50' r='9' fill='white'/><path d='M50 17 Q60 5 72 10' stroke='%23c98a3a' stroke-width='6' fill='none'/></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-left">
          <button class="icon-btn" id="btn-home" aria-label="Levels"></button>
          <button class="icon-btn" id="btn-restart" aria-label="Restart level"></button>
        </div>
        <div class="progress" aria-label="Walls left">
          <div class="progress-fill" id="progress-fill"></div>
          <span class="progress-level" id="progress-level"></span>
        </div>
        <div class="hud-right">
          <button class="icon-btn" id="btn-sound" aria-label="Sound on or off"></button>
        </div>
      </div>
      <div class="picker" id="picker" role="toolbar" aria-label="Pick something to throw"></div>
    </div>

    <section id="screen-title" class="screen">
      <h1 class="logo"><span>Break</span> <span>the</span> <span>Wall!</span></h1>
      <button class="big-btn pulse" id="btn-play" aria-label="Play"></button>
    </section>

    <section id="screen-levels" class="screen hidden">
      <div class="levels-top">
        <button class="icon-btn" id="btn-levels-back" aria-label="Back to title"></button>
      </div>
      <div class="level-grid" id="level-grid"></div>
    </section>

    <section id="overlay-intro" class="overlay hidden">
      <div class="card intro-card">
        <div class="intro-new" aria-hidden="true">NEW!</div>
        <canvas id="intro-item" width="320" height="320"></canvas>
        <div class="intro-good" id="intro-good"></div>
        <button class="big-btn" id="btn-intro-go" aria-label="Let's go"></button>
      </div>
    </section>

    <section id="overlay-clear" class="overlay hidden">
      <div class="card clear-card">
        <div class="stars" id="clear-stars"></div>
        <div class="clear-buttons">
          <button class="icon-btn mid" id="btn-clear-levels" aria-label="Levels"></button>
          <button class="icon-btn mid" id="btn-clear-replay" aria-label="Play again"></button>
          <button class="big-btn pulse" id="btn-clear-next" aria-label="Next level"></button>
        </div>
      </div>
    </section>

    <div id="rotate-hint" aria-hidden="true">
      <div class="phone"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
